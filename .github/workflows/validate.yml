name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  # Часть проверок HACS смотрит на настройки репозитория, а не на код: описание,
  # темы, иконку. Поправить их коммитом нельзя, а перепроверить надо — отсюда
  # ручной запуск.
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration

  lint-and-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Home Assistant намеренно не ставится: набор тестов проверяет чистую
          # логику — протокол SIP, разбор URL, хранилище — и специально написан так,
          # чтобы работать без него. С ним тесты не станут лучше, зато сломаются о
          # pytest-socket, который запрещает сокеты, а фальшивый регистратор на них
          # и держится.
          pip install ruff==0.16.4 pytest pytest-asyncio pyyaml
      - name: Ruff
        run: ruff check custom_components tests scripts
      - name: YAML
        run: python scripts/validate_yaml.py
      - name: Карточки
        # Карточки идут без сборки, поэтому больше ничто не заметит, что модуль
        # падает при загрузке — а падающий модуль уносит с собой все остальные
        # пользовательские карточки на дашборде.
        run: node scripts/check_cards.js
      - name: Pytest
        run: pytest tests -q
