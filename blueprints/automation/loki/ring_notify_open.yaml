blueprint:
  name: Loki — звонок в дверь с видео и кнопкой «Открыть»
  description: >
    При входящем звонке с домофона отправляет actionable-уведомление на телефон:
    снимок с камеры двери и кнопка «Открыть» прямо в уведомлении. Работает и когда
    вас нет дома, и когда дашборд закрыт.


    Для проверки без реального звонка вызовите действие **Loki: Сымитировать звонок**
    (`loki.simulate_ring`) с id нужной двери.
  domain: automation
  # Without source_url the blueprint cannot be updated from the UI.
  source_url: https://github.com/william-aqn/home-assistant-domofon-hacs/blob/main/blueprints/automation/loki/ring_notify_open.yaml
  author: william-aqn
  input:
    notify_device:
      name: Телефон для уведомления
      description: >
        Устройство с установленным приложением Home Assistant. Используется действие
        устройства `mobile_app`, поэтому имя службы уведомления подставлять не нужно.
      selector:
        device:
          filter:
            integration: mobile_app
    open_action_title:
      name: Текст кнопки открытия
      default: Открыть
      selector:
        text:
    hangup_action_title:
      name: Текст кнопки отказа
      description: >
        Вторая кнопка в уведомлении: убирает звонок из Home Assistant, не открывая
        дверь. Домофон при этом продолжает звонить на телефон жильца — отменить
        вызов целиком отсюда нельзя и не нужно.


        Пустое поле — кнопки не будет.
      default: Сбросить
      selector:
        text:
    notification_tag:
      name: Тег уведомления
      description: >
        Уведомления с одинаковым тегом заменяют друг друга, поэтому старый звонок
        не копится на экране.
      default: loki_ring
      selector:
        text:
    notification_channel:
      name: Канал уведомлений (только Android)
      description: >
        Канал создаётся один раз и потом неизменяем, а важность можно только понижать.
        Латиница безопаснее.
      default: Loki Domofon
      selector:
        text:
    click_target:
      name: Что открыть по нажатию на уведомление
      description: >
        Нажатие на кнопку «Открыть» открывает дверь. А нажатие на само уведомление
        показывает это. Страница домофона и страница со всеми требуют, чтобы в
        настройках интеграции была включена страница «Домофоны».
      default: door
      selector:
        select:
          options:
            - label: Страницу этого домофона — картинка и кнопка открытия
              value: door
            - label: Страницу со всеми домофонами
              value: all
            - label: Ничего — просто откроет Home Assistant
              value: none
    wait_timeout:
      name: Сколько ждать нажатия
      description: >
        Должно совпадать с CALL_TIMEOUT интеграции (по умолчанию 120 с), иначе
        автоматизация будет ждать вызов, который уже снят по таймауту.
      default:
        minutes: 2
      selector:
        duration:

mode: parallel
max: 10

triggers:
  - trigger: event
    event_type: loki_event
    event_data:
      type: call_incoming

conditions: []

actions:
  - alias: Подготовить переменные
    variables:
      # A blueprint input is a YAML tag, not a template variable: using
      # {{ notification_tag }} without binding it here renders as undefined.
      tag_in: !input notification_tag
      click_in: !input click_target
      channel_in: !input notification_channel
      open_title: !input open_action_title

      device_id: "{{ trigger.event.data.device_id }}"
      device_name: "{{ trigger.event.data.device_name }}"
      call_id: "{{ trigger.event.data.call_id }}"
      # entity_id is null when the door has no camera, or its camera entity is
      # disabled. Normalise to '' so the checks below are simple.
      camera_entity: "{{ trigger.event.data.entity_id | default('', true) }}"

      # Keyed on the run, not on the door: two rings at the same door inside the
      # timeout would otherwise share one action name, and a single tap would open
      # the door twice.
      action_open: "LOKI_OPEN_{{ context.id }}"
      action_hangup: "LOKI_DROP_{{ context.id }}"
      hangup_title: !input hangup_action_title

      # The notification tag is per door. A second ring at the same door should
      # replace the first notification, which is what one shared tag gives -- but a
      # tag shared across *different* doors would make one door's ring wipe another's.
      tag_door: "{{ tag_in }}_{{ device_id }}"

      # Assembled key by key rather than as two whole literals: an empty `image`
      # breaks attachment loading on Android, and an empty `clickAction` sends the tap
      # nowhere, so a key is either present and valid or absent entirely.
      notify_data: >-
        {% set acts = [{'action': action_open, 'title': open_title}] %}
        {% if hangup_title | trim %}
        {% set acts = acts + [{'action': action_hangup, 'title': hangup_title}] %}
        {% endif %}
        {% set data = {'tag': tag_door, 'channel': channel_in,
                       'importance': 'high', 'ttl': 0, 'priority': 'high',
                       'actions': acts,
                       'push': {'interruption-level': 'time-sensitive'}} %}
        {% if camera_entity %}
        {% set data = dict(data, image='/api/camera_proxy/' ~ camera_entity,
                           entity_id=camera_entity) %}
        {% endif %}
        {% if click_in == 'door' %}
        {% set data = dict(data, clickAction='/loki/' ~ device_id) %}
        {% elif click_in == 'all' %}
        {% set data = dict(data, clickAction='/loki') %}
        {% endif %}
        {{ data }}

  - alias: Отправить уведомление со снимком и кнопкой
    domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: Звонок в дверь
    message: "{{ device_name }}"
    data: "{{ notify_data }}"

  - alias: Ждать нажатия кнопки «Открыть» или конца этого вызова
    wait_for_trigger:
      # Templates in event_data are supported here since HA 2021.3 and are rendered
      # when the trigger is attached, against this run's variables.
      - trigger: event
        id: open
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_open }}"
      - trigger: event
        id: hangup
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_hangup }}"
      # Watching for the end of *this* call, matched on call_id, is what lets the run
      # finish the moment the caller gives up instead of idling for the whole timeout
      # -- and, more importantly, what tells a superseded run to keep its hands off a
      # notification that now belongs to a newer ring at the same door.
      - trigger: event
        id: ended
        event_type: loki_event
        event_data:
          type: call_ended
          call_id: "{{ call_id }}"
    timeout: !input wait_timeout
    continue_on_timeout: true

  - choose:
      - alias: Нажали «Открыть»
        conditions:
          - condition: template
            value_template: "{{ wait.trigger is defined and wait.trigger.id == 'open' }}"
        sequence:
          # continue_on_error on both: a refused open must not abandon the rest of the
          # run. Without it the branch stays on 180 Ringing and the notification hangs
          # on the phone -- the two things this sequence exists to prevent.
          - action: loki.open_door
            continue_on_error: true
            data:
              device_id: "{{ device_id }}"
          - alias: Завершить вызов — дверь открыта, держать его больше незачем
            # Also releases the SIP branch. Sitting on 180 Ringing after the door has
            # opened keeps a forking proxy from delivering the other branches' final
            # responses, so the resident's phone would go on ringing for no reason.
            action: loki.hangup
            continue_on_error: true
            data:
              device_id: "{{ device_id }}"
          - alias: Убрать уведомление — кнопка уже нажата
            domain: mobile_app
            type: notify
            device_id: !input notify_device
            message: clear_notification
            data: "{{ {'tag': tag_door} }}"

      - alias: Нажали «Сбросить»
        conditions:
          - condition: template
            value_template: >-
              {{ wait.trigger is defined and wait.trigger.id == 'hangup' }}
        sequence:
          # Releases our own SIP branch and nothing else: the intercom goes on
          # ringing the resident's phone, which is the whole point of never
          # declining globally from here.
          - action: loki.hangup
            continue_on_error: true
            data:
              device_id: "{{ device_id }}"
          - alias: Убрать уведомление — решение принято
            domain: mobile_app
            type: notify
            device_id: !input notify_device
            message: clear_notification
            data: "{{ {'tag': tag_door} }}"

      - alias: Звонок вытеснен новым звонком в ту же дверь
        conditions:
          - condition: template
            value_template: >-
              {{ wait.trigger is defined and wait.trigger.id == 'ended'
                 and wait.trigger.event.data.reason == 'superseded' }}
        # Nothing. The notification carrying this door's tag is the newer ring's now,
        # and clearing it here would wipe a call still in progress.
        sequence: []

    default:
      - alias: Убрать «висящее» уведомление — вызов окончен или истёк таймаут
        domain: mobile_app
        type: notify
        device_id: !input notify_device
        message: clear_notification
        data: "{{ {'tag': tag_door} }}"
